        ];

        const container = document.getElementById('storiesContainer');
        const searchInput = document.getElementById('searchInput');
        const valueFilter = document.getElementById('valueFilter');
        const noResultsMsg = document.getElementById('noResults');

        // Función para renderizar las tarjetas
        function renderStories(storiesToRender) {
            container.innerHTML = '';
            
            if (storiesToRender.length === 0) {
                noResultsMsg.classList.remove('hidden');
            } else {
                noResultsMsg.classList.add('hidden');
                
                storiesToRender.forEach(story => {
                    const card = document.createElement('div');
                    card.className = `story-card bg-card_bg rounded-2xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer hover:shadow-hover transition-all duration-300`;
                    
                    // Aseguramos que la tarjeta en sí tenga el onclick para expandir
                    card.onclick = () => toggleCard(card.id);
                    card.id = `story-${story.id}`;

                    card.innerHTML = `
                        <!-- Encabezado de la tarjeta (siempre visible) -->
                        <div class="p-6 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full ${story.categoryColor} flex items-center justify-center flex-shrink-0 print:border print:border-gray-300">
                                    <i class="fa-solid ${story.icon} text-xl"></i>
                                </div>
                                <div>
                                    <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${story.categoryColor} mb-2 print:border print:border-gray-300">
                                        ${story.value}
                                    </span>
                                    <h3 class="text-xl font-bold text-text_main leading-tight">${story.title}</h3>
                                </div>
                            </div>
                            <div class="chevron-icon text-text_muted p-2 no-print">
                                <i class="fa-solid fa-chevron-down text-xl"></i>
                            </div>
                        </div>

                        <!-- Detalles expandibles -->
                        <div class="story-details bg-gray-50/50 px-6 pb-6 border-t border-gray-50 print:bg-white print:border-none">
                            <div class="grid md:grid-cols-2 gap-6">
                                <!-- Columna Izquierda: Preguntas -->
                                <div>
                                    <div class="flex items-center gap-2 text-primary font-bold mb-3">
                                        <i class="fa-regular fa-comments"></i>
                                        <h4>Preguntas para conversar</h4>
                                    </div>
                                    <ul class="space-y-3">
                                        ${story.questions.map(q => `
                                            <li class="flex items-start gap-2">
                                                <i class="fa-solid fa-circle-question text-primary_light mt-1 text-sm"></i>
                                                <span class="text-text_main text-sm md:text-base leading-relaxed">${q}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>

                                <!-- Columna Derecha: Consejo y Actividad -->
                                <div class="space-y-6">
                                    <div class="bg-white p-4 rounded-xl shadow-sm border border-orange-50 print:border-gray-200 print:shadow-none">
                                        <div class="flex items-center gap-2 text-primary font-bold mb-2">
                                            <i class="fa-regular fa-lightbulb"></i>
                                            <h4>Consejo para padres</h4>
                                        </div>
                                        <p class="text-text_main text-sm md:text-base italic">${story.tip}</p>
                                    </div>
                                    
                                    <div class="bg-primary/10 p-4 rounded-xl border border-primary/20 print:bg-white print:border-gray-200">
                                        <div class="flex items-center gap-2 text-primary font-bold mb-2">
                                            <i class="fa-solid fa-hands-holding-child"></i>
                                            <h4>Actividad de refuerzo</h4>
                                        </div>
                                        <p class="text-text_main text-sm md:text-base">${story.activity}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        // Función para expandir/colapsar tarjeta
        function toggleCard(cardId) {
            // Evitar comportamiento interactivo durante impresión
            if (window.matchMedia('print').matches) return;

            const card = document.getElementById(cardId);
            
            // Si queremos acordeón (solo una abierta a la vez):
            // document.querySelectorAll('.story-card.expanded').forEach(c => {
            //     if(c.id !== cardId) c.classList.remove('expanded');
            // });

            card.classList.toggle('expanded');
        }

        // Función de filtrado combinada
        function filterStories() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedValue = valueFilter.value;

            const filtered = stories.filter(story => {
                const matchesSearch = story.title.toLowerCase().includes(searchTerm) || 
                                      story.value.toLowerCase().includes(searchTerm);
                const matchesValue = selectedValue === 'todos' || story.value === selectedValue;
                
                return matchesSearch && matchesValue;
            });

            renderStories(filtered);
        }

        // Función para limpiar filtros
        function resetFilters() {
            searchInput.value = '';
            valueFilter.value = 'todos';
            filterStories();
        }

        // Event Listeners
        searchInput.addEventListener('input', filterStories);
        valueFilter.addEventListener('change', filterStories);

        // Renderizar todo al cargar
        document.addEventListener('DOMContentLoaded', () => {
            renderStories(stories);
            
            // Expandir la primera tarjeta como ejemplo (opcional, comentado para una vista más limpia inicial)
            // if(stories.length > 0) {
            //    setTimeout(() => toggleCard(`story-${stories[0].id}`), 500);
            // }
        });

    </script>
</body>
</html>
