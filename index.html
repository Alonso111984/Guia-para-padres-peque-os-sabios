<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pequeños Sabios — Guía para Padres</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            orange: '#FF6B35',
                            cream: '#FDFBF7',
                            card: '#FFFFFF',
                            purple: '#F3E8FF',
                            purpleText: '#7E22CE',
                            green: '#DCFCE7',
                            greenText: '#15803D',
                            text: '#2D3748',
                            muted: '#718096'
                        }
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.brand.cream');
            color: theme('colors.brand.text');
            -webkit-tap-highlight-color: transparent;
        }

        /* Hide scrollbar for chips but allow scrolling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Smooth Accordion using Grid */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .accordion-content.is-open {
            grid-template-rows: 1fr;
        }

        .accordion-inner {
            overflow: hidden;
        }

        .caret-icon {
            transition: transform 0.3s ease;
        }
        
        .is-open .caret-icon {
            transform: rotate(180deg);
        }

        /* Print Styles */
        @media print {
            body { background-color: white; color: black; }
            .no-print { display: none !important; }
            .accordion-content { 
                display: block !important; 
                grid-template-rows: auto !important; 
                height: auto !important;
            }
            .accordion-inner { overflow: visible !important; }
            .print-card { 
                box-shadow: none !important; 
                border: 1px solid #e2e8f0; 
                break-inside: avoid;
                margin-bottom: 1rem;
            }
            .print-badge { border: 1px solid #ccc; background: white !important; color: black !important; }
            h1, h2, h3 { color: black !important; }
            .caret-icon { display: none; }
        }
    </style>
</head>
<body class="antialiased min-h-screen pb-20">

    <header class="sticky top-0 z-50 bg-[#FDFBF7]/95 backdrop-blur-md pt-6 pb-4 px-4 sm:px-6 shadow-sm no-print">
        <div class="max-w-3xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="font-display text-2xl sm:text-3xl text-brand-orange font-bold leading-tight">Pequeños Sabios</h1>
                    <p class="text-brand-muted text-sm font-medium">Guía para Padres</p>
                </div>
                <button onclick="window.print()" class="p-3 bg-white rounded-2xl shadow-premium text-brand-orange hover:bg-orange-50 transition-colors" aria-label="Imprimir guía">
                    <i class="ph ph-printer text-2xl"></i>
                </button>
            </div>

            <!-- Search Bar -->
            <div class="relative mb-4">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="ph ph-magnifying-glass text-brand-muted text-xl"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Buscar cuento o valor..." 
                    class="w-full pl-11 pr-4 py-3.5 bg-white border border-gray-100 rounded-2xl shadow-premium text-brand-text placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all font-sans">
            </div>

            <!-- Category Chips -->
            <div class="flex overflow-x-auto hide-scrollbar gap-2 pb-2 -mx-4 px-4 sm:mx-0 sm:px-0" id="filterContainer">
                <!-- Chips will be generated here -->
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 mt-6" id="contentContainer">
        <!-- Content will be injected here via JS -->
    </main>

    <script>
        const appData = [
            {
                id: "pantalla",
                name: "Tiempo de Pantalla",
                stories: [
                    {
                        title: "El Reloj del Capitán Tiempo",
                        value: "Manejo del tiempo",
                        questions: [
                            "¿Qué pasó cuando el Capitán Tiempo le mostró a Leo que las pantallas tienen un inicio y un fin?",
                            "¿Qué aventuras te gustaría vivir tú cuando se apague la pantalla?",
                            "¿Cómo te sientes cuando sabes cuánto tiempo vas a jugar antes de empezar?"
                        ],
                        advice: "Antes de dar la pantalla, acuerden juntos cuánto tiempo va a durar usando un reloj o temporizador visible, así el niño ve el tiempo pasar en vez de que se lo quiten de sorpresa.",
                        activity: "Sean ustedes el \"Capitán Tiempo\": pongan una alarma divertida (como un sonido de barco) que avise 5 minutos antes de que termine el tiempo de pantalla."
                    },
                    {
                        title: "La Tableta de la Sabiduría",
                        value: "Curiosidad y uso productivo de la tecnología",
                        questions: [
                            "¿Qué hizo Sofía como detective para resolver el misterio de la oruga?",
                            "¿Qué misterio te gustaría investigar tú con ayuda de una tableta o un libro?",
                            "¿Qué diferencia hay entre usar la tableta para jugar y usarla para aprender algo nuevo?"
                        ],
                        advice: "Guarda una o dos apps o videos educativos como \"favoritos\" y ofrécelos como primera opción antes que el entretenimiento pasivo, para que la tecnología se asocie también con descubrir cosas.",
                        activity: "Elijan juntos un \"misterio de la semana\" (como de qué está hecha una nube) e investíguenlo juntos usando la tableta como herramienta, no como distracción."
                    },
                    {
                        title: "El Adiós sin Lágrimas",
                        value: "Manejo de la frustración y las despedidas",
                        questions: [
                            "¿Cómo logró Mateo convertir el \"adiós\" al celular en un juego?",
                            "¿Qué juego podrías inventar tú para despedirte de la pantalla sin enojarte?",
                            "¿Qué te ayuda a sentirte mejor cuando algo divertido se tiene que terminar?"
                        ],
                        advice: "Convierte el momento de \"apagar la pantalla\" en un ritual breve y positivo (una frase, un gesto, una canción de 10 segundos) en vez de una orden repentina — reduce mucho las rabietas.",
                        activity: "Inventen juntos su propio \"ritual de despedida\" de la pantalla esta semana y practíquenlo cada vez que se apague."
                    },
                    {
                        title: "Los Ojos del Búho Curioso",
                        value: "Autocuidado y descanso",
                        questions: [
                            "¿Por qué Ulises el buhito necesitaba descansar sus ojos?",
                            "¿Cómo sabes tú cuándo tus ojos o tu cuerpo están cansados?",
                            "¿Qué te gusta hacer para descansar cuando has estado mucho tiempo mirando algo?"
                        ],
                        advice: "Enséñale la regla sencilla de \"mirar lejos cada rato\": cada cierto tiempo de pantalla, miren juntos algo lejano por unos segundos, como hacía Ulises.",
                        activity: "Practiquen esta semana una \"pausa de búho\": cada 20-30 minutos de pantalla, hagan una pausa de 1 minuto mirando por la ventana."
                    }
                ]
            },
            {
                id: "aprender",
                name: "Aprender y Descubrir",
                stories: [
                    {
                        title: "El Safari de las Vocales",
                        value: "Curiosidad por aprender",
                        questions: [
                            "¿Qué tesoros buscaban Lupe y Coco en su safari?",
                            "¿Qué letra o palabra te gustaría \"cazar\" tú en un safari de aprendizaje?",
                            "¿Dónde has visto vocales escondidas hoy, como en tu casa o en la calle?"
                        ],
                        advice: "Convierte el aprendizaje en un juego de búsqueda: \"busca 3 cosas que empiecen con la letra A\" mientras caminan o están en casa.",
                        activity: "Hagan esta semana su propio \"safari de letras\" en casa, buscando objetos que empiecen con cada vocal."
                    },
                    {
                        title: "La Tienda de los Números Saltarines",
                        value: "Perseverancia al aprender",
                        questions: [
                            "¿Cómo ayudó Bruno a contar las frutas saltarinas en el mercado?",
                            "¿Qué cosas te gustaría contar tú, como en la tienda de Don Zanahoria?",
                            "¿Qué haces cuando te equivocas al contar o al aprender algo nuevo?"
                        ],
                        advice: "Aprovecha momentos cotidianos (poner la mesa, guardar juguetes) para contar en voz alta juntos, sin presión de \"hacerlo bien\", solo practicando con calma.",
                        activity: "Jueguen esta semana a la \"tienda\": armen una tiendita en casa con juguetes o frutas de mentira y cuenten juntos los \"productos\"."
                    },
                    {
                        title: "El Pequeño Científico de las Preguntas",
                        value: "Curiosidad sin miedo a preguntar",
                        questions: [
                            "¿Qué descubrió Dani sobre hacer preguntas como los científicos?",
                            "¿Cuál es la pregunta \"por qué\" que más te gustaría hacerme a mí?",
                            "¿Cómo te sientes cuando alguien responde tus preguntas con paciencia?"
                        ],
                        advice: "Cuando tu hijo pregunte algo que no sabes responder, celebra la pregunta en vez de esquivarla: \"¡qué buena pregunta! busquemos la respuesta juntos\".",
                        activity: "Esta semana, tengan un \"frasco de preguntas\": cada vez que surja una pregunta curiosa, anótenla y busquen la respuesta juntos un rato después."
                    },
                    {
                        title: "Formas en el Espacio",
                        value: "Observación y creatividad",
                        questions: [
                            "¿Qué formas encontraron Luna y Bip para armar su cohete?",
                            "¿Qué formas puedes encontrar tú a tu alrededor ahora mismo?",
                            "¿Qué construirías tú si tuvieras un cohete de formas mágicas?"
                        ],
                        advice: "Al pasear o estar en casa, señala formas geométricas en objetos cotidianos (una ventana es un rectángulo, un plato es un círculo) para entrenar su observación de forma natural.",
                        activity: "Construyan juntos algo (una nave, una casa, un animal) usando solo objetos con formas geométricas que tengan en casa."
                    }
                ]
            },
            {
                id: "rutinas",
                name: "Rutinas y Autonomía",
                stories: [
                    {
                        title: "La Misión del Baño Divertido",
                        value: "Autonomía en el cuidado personal",
                        questions: [
                            "¿Cómo se convirtió Mía en la Capitana Burbuja para vencer a los bichitos traviesos?",
                            "¿Qué superhéroe o superheroína te gustaría ser tú a la hora del baño?",
                            "¿Qué parte de bañarte te gusta hacer tú solito/a?"
                        ],
                        advice: "Dale a tu hijo pequeñas \"misiones\" durante el baño (enjabonar sus manos, enjuagarse solo) en vez de hacerlo todo por él — refuerza autonomía sin quitarle la diversión.",
                        activity: "Esta semana, elijan juntos un \"nombre de superhéroe del baño\" y una misión especial que pueda cumplir solo cada noche."
                    },
                    {
                        title: "El Ejército del Orden",
                        value: "Responsabilidad y orden",
                        questions: [
                            "¿Cómo descubrió Simón que ordenar juguetes puede ser un juego?",
                            "¿Qué juego inventarías tú para ordenar tu cuarto?",
                            "¿Cómo te sientes cuando tu espacio está ordenado?"
                        ],
                        advice: "Convierte ordenar en un reto con tiempo (\"¿puedes guardar todo antes de que termine esta canción?\") en vez de una orden seria — mantiene la diversión sin perder el hábito.",
                        activity: "Elijan juntos una canción \"de ordenar\" que pondrán cada noche esta semana como señal de que es hora de guardar los juguetes."
                    },
                    {
                        title: "El Viaje al Mundo de los Sueños",
                        value: "Rutina de sueño",
                        questions: [
                            "¿Cómo era el Tren de los Sueños que Nina tomaba cada noche?",
                            "¿Qué te gustaría soñar tú esta noche si tomaras ese tren?",
                            "¿Qué te ayuda a sentirte tranquilo/a antes de dormir?"
                        ],
                        advice: "Crea una pequeña rutina fija antes de dormir (bañarse, cuento, luz baja) que se repita cada noche en el mismo orden — la previsibilidad ayuda mucho a que los niños se relajen.",
                        activity: "Esta semana, elijan juntos los \"3 pasos del tren de los sueños\" que van a seguir cada noche antes de dormir."
                    },
                    {
                        title: "El Desayuno de los Campeones",
                        value: "Hábitos saludables y autonomía",
                        questions: [
                            "¿Qué pasó cuando el desayuno de Teo cobró vida?",
                            "¿Qué desayuno te da a ti energía de campeón?",
                            "¿Qué parte del desayuno te gustaría preparar tú solo/a?"
                        ],
                        advice: "Invita a tu hijo a participar en preparar (aunque sea una parte simple) su desayuno — sentirse \"capaz\" de contribuir aumenta su disposición a comer bien.",
                        activity: "Elijan juntos un \"desayuno de campeón\" para preparar juntos un día esta semana, dejando que tu hijo elija o prepare algo por sí mismo."
                    }
                ]
            },
            {
                id: "emociones",
                name: "Emociones y Escuela",
                stories: [
                    {
                        title: "El Semáforo de las Emociones",
                        value: "Reconocer y nombrar emociones",
                        questions: [
                            "¿Qué colores usaba Julia para entender sus emociones con Don Semáforo?",
                            "¿De qué color dirías que está tu semáforo ahora mismo (rojo, amarillo o verde)?",
                            "¿Qué te ayuda a pasar del rojo al verde cuando estás molesto/a?"
                        ],
                        advice: "Cuando tu hijo esté alterado, en vez de pedirle que \"se calme\", pregúntale de qué color está su semáforo — le da un lenguaje simple para expresar lo que siente sin necesitar más palabras.",
                        activity: "Hagan juntos un semáforo de cartulina esta semana y úsenlo en casa cuando alguien necesite decir cómo se siente."
                    },
                    {
                        title: "Un Día en la Escuela de Magia",
                        value: "Valentía ante el cambio",
                        questions: [
                            "¿Qué magia descubrió Martín en su primer día de escuela?",
                            "¿Qué fue lo que más te dio nervios a ti en tu primer día de algo nuevo?",
                            "¿Qué te ayudaría a sentirte más valiente en una situación nueva?"
                        ],
                        advice: "Antes de una situación nueva (primer día de clases, una fiesta, un lugar desconocido), habla con tu hijo sobre qué esperar — reduce la ansiedad al quitarle lo \"desconocido\" a la experiencia.",
                        activity: "Esta semana, hablen de algo nuevo que se acerque (una actividad, un lugar) y hagan juntos una lista de las cosas buenas que podrían pasar."
                    },
                    {
                        title: "El Abrazo de la Calma",
                        value: "Autorregulación emocional",
                        questions: [
                            "¿Cómo hacía Koko el koalita para calmar su volcán de enojo?",
                            "¿Qué haces tú para calmarte cuando sientes que vas a \"explotar\"?",
                            "¿Quién te da los mejores abrazos de calma?"
                        ],
                        advice: "Enséñale a tu hijo una técnica de respiración simple (como \"soplar velitas\" igual que Koko) que pueda usar como su propia herramienta cuando se sienta abrumado.",
                        activity: "Practiquen juntos varias veces esta semana la respiración de \"soplar velitas\" en momentos tranquilos, para que ya la conozca cuando la necesite en un momento de enojo."
                    },
                    {
                        title: "El Gran Libro de los Lo Siento",
                        value: "Empatía y disculpa sincera",
                        questions: [
                            "¿Cuáles eran los tres pasos mágicos que aprendió Pipa la zorrita para pedir perdón?",
                            "¿Alguna vez tuviste que pedir perdón a alguien? ¿Cómo te sentiste después?",
                            "¿Cómo te sientes cuando alguien te pide perdón de verdad?"
                        ],
                        advice: "Enseña a tu hijo que una disculpa completa tiene tres partes: reconocer lo que pasó, decir cómo se siente el otro, y decir qué hará diferente — no solo decir \"perdón\" rápido y seguir jugando.",
                        activity: "La próxima vez que surja un conflicto esta semana, practiquen juntos los \"tres pasos mágicos\" de Pipa para pedir perdón de verdad."
                    }
                ]
            },
            {
                id: "modales",
                name: "Modales y Valores",
                stories: [
                    {
                        title: "Las Llaves de Oro",
                        value: "Modales básicos",
                        questions: [
                            "¿Qué puertas mágicas pudo abrir Valentina usando \"por favor\", \"gracias\" y \"perdón\"?",
                            "¿Qué palabra mágica usas tú más seguido?",
                            "¿Cómo cambia la cara de alguien cuando le dices \"gracias\"?"
                        ],
                        advice: "Modela tú mismo estas palabras en el día a día con tu hijo (dile \"gracias\" y \"por favor\" a él también) — los niños imitan más lo que ven que lo que se les dice.",
                        activity: "Esta semana, hagan un \"conteo de llaves de oro\": cada vez que alguien en casa use por favor, gracias o perdón, agreguen una llave de papel a un frasco."
                    },
                    {
                        title: "El Dragón que Aprendió a Esperar",
                        value: "Paciencia",
                        questions: [
                            "¿Cuál era el truco secreto que descubrió Chispa el dragoncito para esperar su turno?",
                            "¿Qué es lo más difícil de esperar para ti?",
                            "¿Qué puedes hacer mientras esperas para que se sienta menos largo?"
                        ],
                        advice: "Dale a tu hijo una \"tarea de espera\" concreta (contar hasta 10, buscar 3 cosas de color azul) en momentos donde tenga que esperar — convierte la espera en algo activo en vez de solo frustrante.",
                        activity: "La próxima vez que tengan que esperar juntos (una fila, el semáforo), practiquen el \"truco secreto\" de Chispa que hayan inventado juntos."
                    },
                    {
                        title: "El Equipo de los Juguetes Amigos",
                        value: "Compartir y generosidad",
                        questions: [
                            "¿Qué descubrieron Emma y Nico sobre compartir sus juguetes?",
                            "¿Cuál es tu juguete favorito para compartir con alguien?",
                            "¿Cómo te sientes cuando alguien comparte algo contigo?"
                        ],
                        advice: "En vez de forzar a compartir todo siempre, deja que tu hijo elija qué está dispuesto a compartir en cada momento — el compartir genuino se construye con práctica, no con obligación.",
                        activity: "Organicen esta semana un momento de juego con otro niño (hermano, primo, amigo) y antes de empezar, pregúntale a tu hijo qué juguetes le gustaría compartir."
                    },
                    {
                        title: "El Eco de la Verdad",
                        value: "Honestidad",
                        questions: [
                            "¿Qué aprendió Tomás sobre cómo se siente el corazón cuando dice la verdad?",
                            "¿Alguna vez te costó decir la verdad? ¿Qué pasó después?",
                            "¿Cómo te sientes tú cuando alguien te dice la verdad, aunque sea difícil de escuchar?"
                        ],
                        advice: "Cuando tu hijo diga la verdad sobre algo difícil (aunque haya hecho algo mal), reconoce primero su honestidad antes de hablar de la consecuencia — así asocia decir la verdad con algo positivo, no con más problemas.",
                        activity: "Esta semana, cuéntale a tu hijo una vez en que decir la verdad fue difícil para ti, y qué aprendiste de esa experiencia."
                    }
                ]
            }
        ];

        let activeCategory = 'all';
        let searchQuery = '';
        
        // Colors for badges to give variety
        const badgeColors = [
            'bg-orange-100 text-orange-700',
            'bg-purple-100 text-purple-700',
            'bg-green-100 text-green-700',
            'bg-blue-100 text-blue-700',
            'bg-pink-100 text-pink-700'
        ];

        function getBadgeColor(index) {
            return badgeColors[index % badgeColors.length];
        }

        function renderFilters() {
            const container = document.getElementById('filterContainer');
            let html = `
                <button onclick="setCategory('all')" 
                    class="px-5 py-2 rounded-full text-sm font-semibold transition-all whitespace-nowrap 
                    ${activeCategory === 'all' ? 'bg-brand-orange text-white shadow-md' : 'bg-white text-brand-muted hover:bg-orange-50'}">
                    Todas
                </button>
            `;
            
            appData.forEach(cat => {
                const isActive = activeCategory === cat.id;
                html += `
                    <button onclick="setCategory('${cat.id}')" 
                        class="px-5 py-2 rounded-full text-sm font-semibold transition-all whitespace-nowrap 
                        ${isActive ? 'bg-brand-orange text-white shadow-md' : 'bg-white text-brand-muted hover:bg-orange-50'}">
                        ${cat.name}
                    </button>
                `;
            });
            
            container.innerHTML = html;
        }

        function setCategory(id) {
            activeCategory = id;
            renderFilters();
            renderContent();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderContent();
        });

        function toggleCard(button) {
            const card = button.closest('.print-card');
            const content = card.querySelector('.accordion-content');
            
            // Toggle open state class for CSS grid transition
            content.classList.toggle('is-open');
        }

        function renderContent() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';

            let hasAnyResults = false;

            appData.forEach((category, catIndex) => {
                // Filter by category chip
                if (activeCategory !== 'all' && activeCategory !== category.id) return;

                // Filter stories by search query
                const filteredStories = category.stories.filter(story => {
                    return story.title.toLowerCase().includes(searchQuery) || 
                           story.value.toLowerCase().includes(searchQuery);
                });

                if (filteredStories.length === 0) return;

                hasAnyResults = true;

                // Category Header
                const section = document.createElement('section');
                section.className = 'mb-10';
                
                const catHeader = document.createElement('h2');
                catHeader.className = 'font-display text-xl font-bold text-brand-text mb-4 pl-2 border-l-4 border-brand-orange';
                catHeader.textContent = category.name;
                section.appendChild(catHeader);

                // Cards Container
                const cardsContainer = document.createElement('div');
                cardsContainer.className = 'space-y-4';

                filteredStories.forEach((story, storyIndex) => {
                    const badgeClass = getBadgeColor(storyIndex);
                    
                    const card = document.createElement('article');
                    card.className = 'print-card bg-white rounded-3xl shadow-premium overflow-hidden transition-all hover:shadow-md';
                    
                    card.innerHTML = `
                        <button onclick="toggleCard(this)" class="w-full text-left p-5 sm:p-6 flex items-center justify-between focus:outline-none focus:bg-orange-50/50 transition-colors">
                            <div class="pr-4">
                                <h3 class="font-display text-lg font-bold text-brand-text mb-2 leading-tight">${story.title}</h3>
                                <span class="print-badge inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold ${badgeClass}">
                                    ${story.value}
                                </span>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-brand-cream flex items-center justify-center flex-shrink-0 text-brand-orange caret-icon">
                                <i class="ph-bold ph-caret-down text-lg"></i>
                            </div>
                        </button>
                        
                        <div class="accordion-content">
                            <div class="accordion-inner">
                                <div class="px-5 pb-6 sm:px-6 sm:pb-8 pt-2 space-y-6 border-t border-gray-50 mx-5 sm:mx-6">
                                    
                                    <!-- Questions -->
                                    <div class="flex gap-4">
                                        <div class="flex-shrink-0 mt-1">
                                            <div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center">
                                                <i class="ph-fill ph-chat-circle-text text-brand-purpleText text-lg"></i>
                                            </div>
                                        </div>
                                        <div>
                                            <h4 class="font-display font-bold text-brand-text mb-2">Para conversar:</h4>
                                            <ul class="space-y-2 text-brand-muted text-sm sm:text-base leading-relaxed">
                                                ${story.questions.map(q => `<li class="flex items-start"><span class="mr-2 text-purple-400">•</span> <span>${q}</span></li>`).join('')}
                                            </ul>
                                        </div>
                                    </div>

                                    <!-- Advice -->
                                    <div class="flex gap-4 bg-[#FCF9F2] p-4 rounded-2xl">
                                        <div class="flex-shrink-0 mt-1">
                                            <div class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center">
                                                <i class="ph-fill ph-lightbulb text-brand-orange text-lg"></i>
                                            </div>
                                        </div>
                                        <div>
                                            <h4 class="font-display font-bold text-brand-text mb-1">Consejo para ti:</h4>
                                            <p class="text-brand-muted text-sm sm:text-base leading-relaxed">${story.advice}</p>
                                        </div>
                                    </div>

                                    <!-- Activity -->
                                    <div class="flex gap-4">
                                        <div class="flex-shrink-0 mt-1">
                                            <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center">
                                                <i class="ph-fill ph-star text-brand-greenText text-lg"></i>
                                            </div>
                                        </div>
                                        <div>
                                            <h4 class="font-display font-bold text-brand-text mb-1">Actividad de la semana:</h4>
                                            <p class="text-brand-muted text-sm sm:text-base leading-relaxed">${story.activity}</p>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    `;
                    cardsContainer.appendChild(card);
                });

                section.appendChild(cardsContainer);
                container.appendChild(section);
            });

            if (!hasAnyResults) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm text-brand-muted">
                            <i class="ph ph-magnifying-glass text-2xl"></i>
                        </div>
                        <h3 class="font-display text-xl font-bold text-brand-text mb-2">No encontramos cuentos</h3>
                        <p class="text-brand-muted">Intenta con otra palabra clave o cambia el filtro.</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            renderContent();
        });
    </script>
</body>
</html>
