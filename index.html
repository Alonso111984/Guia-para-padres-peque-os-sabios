<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pequeños Sabios — Guía para Padres</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Quicksand', 'sans-serif'],
                        body: ['Nunito Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: '#FF6B35',
                        background: '#FAF8F5',
                        // Paleta de categorías
                        cat: {
                            screen: { bg: '#E0F2FE', text: '#0284C7', border: '#7DD3FC' }, // Azul cielo
                            learn: { bg: '#DCFCE7', text: '#15803D', border: '#86EFAC' },  // Verde salvia/menta
                            routine: { bg: '#FFE4E6', text: '#BE123C', border: '#FDA4AF' }, // Rosa coral
                            emotion: { bg: '#F3E8FF', text: '#6B21A8', border: '#D8B4FE' }, // Morado suave
                            values: { bg: '#FFEDD5', text: '#C2410C', border: '#FDBA74' },  // Naranja/Ámbar
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.03)',
                        'floating': '0 10px 30px -5px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAF8F5;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animación suave para el acordeón usando CSS Grid */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .accordion-content-inner {
            overflow: hidden;
        }
        .card.expanded .accordion-content {
            grid-template-rows: 1fr;
        }
        
        .card-icon-rotate {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card.expanded .card-icon-rotate {
            transform: rotate(180deg);
        }

        /* Ocultar barra de scroll en los filtros */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Estilos específicos para impresión */
        @media print {
            body { background-color: white; color: black; }
            header, .filters-container { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; }
            
            .category-section { margin-bottom: 2rem !important; page-break-inside: avoid; }
            .category-header { background: none !important; padding: 0 !important; border-bottom: 2px solid #ccc; margin-bottom: 1rem; }
            
            .card { 
                box-shadow: none !important; 
                border: 1px solid #eee; 
                margin-bottom: 1rem !important; 
                page-break-inside: avoid;
            }
            .card-icon-rotate { display: none !important; }
            
            /* Expandir todo para imprimir */
            .accordion-content { grid-template-rows: 1fr !important; }
            .accordion-content-inner { padding-top: 1rem !important; }
            
            /* Ajustes de color para ahorro de tinta */
            .badge { background: none !important; border: 1px solid #ccc; color: #333 !important; }
            .text-cat-screen-text, .text-cat-learn-text, .text-cat-routine-text, .text-cat-emotion-text, .text-cat-values-text { color: black !important; }
            .bg-cat-screen-bg, .bg-cat-learn-bg, .bg-cat-routine-bg, .bg-cat-emotion-bg, .bg-cat-values-bg { background-color: transparent !important; }
        }
    </style>
</head>
<body class="font-body text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 bg-background/90 backdrop-blur-md border-b border-gray-100 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand text-white flex items-center justify-center shadow-md">
                    <i class="ph ph-books text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-display font-bold text-xl leading-tight text-gray-900">Pequeños Sabios</h1>
                    <p class="text-sm text-gray-500 font-medium">Guía para Padres</p>
                </div>
            </div>
            <button onclick="window.print()" class="p-2.5 rounded-full bg-white text-gray-600 shadow-sm border border-gray-100 hover:bg-gray-50 hover:text-brand transition-colors focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2" aria-label="Imprimir guía">
                <i class="ph ph-printer text-xl"></i>
            </button>
        </div>

        <!-- Filtros -->
        <div class="max-w-3xl mx-auto px-4 sm:px-6 pb-4">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1 filters-container" id="filters-container">
                <!-- Los chips de filtro se generarán por JS -->
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 py-8 pb-24" id="content-container">
        <!-- El contenido se inyectará aquí vía JS -->
    </main>

        let currentFilter = 'todas';

        function renderFilters() {
            const container = document.getElementById('filters-container');
            let html = `
                <button onclick="setFilter('todas')" 
                        class="filter-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-200 border-2 ${currentFilter === 'todas' ? 'bg-brand text-white border-brand shadow-sm' : 'bg-white text-gray-500 border-gray-200 hover:border-brand/50'}">
                    Todas
                </button>
            `;

            appData.forEach(cat => {
                // Clases dinámicas de Tailwind basadas en la categoría seleccionada
                const isActive = currentFilter === cat.id;
                const bgClass = isActive ? `bg-cat-${cat.colorRef}-bg` : 'bg-white';
                const textClass = isActive ? `text-cat-${cat.colorRef}-text` : 'text-gray-500';
                const borderClass = isActive ? `border-cat-${cat.colorRef}-border` : 'border-gray-200 hover:border-gray-300';
                
                html += `
                    <button onclick="setFilter('${cat.id}')" 
                            class="filter-chip whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-bold transition-all duration-200 border-2 ${bgClass} ${textClass} ${borderClass} ${isActive ? 'shadow-sm' : ''}">
                        ${cat.title}
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            let html = '';

            const categoriesToShow = currentFilter === 'todas' 
                ? appData 
                : appData.filter(c => c.id === currentFilter);

            categoriesToShow.forEach(cat => {
                // Sección de categoría con su color de acento
                html += `
                    <section class="category-section mb-10 opacity-0 transition-opacity duration-500" style="animation: fadeIn 0.5s forwards;">
                        <div class="category-header bg-cat-${cat.colorRef}-bg text-cat-${cat.colorRef}-text rounded-2xl p-5 mb-6 flex items-center gap-3 shadow-sm border border-cat-${cat.colorRef}-border/50">
                            <i class="ph ${cat.icon} text-3xl"></i>
                            <h2 class="font-display font-bold text-xl">${cat.title}</h2>
                        </div>
                        <div class="flex flex-col gap-4">
                `;

                cat.stories.forEach((story, index) => {
                    // ID único para accesibilidad y toggle
                    const cardId = `card-${cat.id}-${index}`;
                    
                    html += `
                        <article class="card bg-white rounded-3xl shadow-soft border border-gray-100 overflow-hidden transition-all duration-300 hover:shadow-floating">
                            
                            <!-- Cabecera de la Tarjeta (Clickable) -->
                            <button onclick="toggleCard('${cardId}')" class="w-full text-left p-5 sm:p-6 flex items-center justify-between gap-4 focus:outline-none focus:bg-gray-50 transition-colors">
                                <div class="flex-1 pr-4">
                                    <h3 class="font-display font-bold text-lg text-gray-900 leading-tight mb-2">${story.title}</h3>
                                    <span class="badge inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wide bg-cat-${cat.colorRef}-bg text-cat-${cat.colorRef}-text border border-cat-${cat.colorRef}-border/50 uppercase">
                                        ${story.value}
                                    </span>
                                </div>
                                <div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center flex-shrink-0 card-icon-rotate text-gray-400">
                                    <i class="ph ph-caret-down text-lg"></i>
                                </div>
                            </button>

                            <!-- Contenido de la Tarjeta (Acordeón) -->
                            <div id="${cardId}" class="accordion-content">
                                <div class="accordion-content-inner px-5 sm:px-6 pb-6 pt-2">
                                    
                                    <!-- Preguntas -->
                                    <div class="mb-6">
                                        <div class="flex items-center gap-2 mb-3 text-cat-${cat.colorRef}-text">
                                            <i class="ph-fill ph-chat-circle-text text-xl"></i>
                                            <h4 class="font-display font-bold text-[1.1rem]">Para conversar:</h4>
                                        </div>
                                        <ul class="space-y-2.5">
                                            ${story.questions.map(q => `
                                                <li class="flex gap-3 text-gray-700">
                                                    <span class="text-cat-${cat.colorRef}-text mt-1 opacity-70 flex-shrink-0"><i class="ph-fill ph-check-circle text-sm"></i></span>
                                                    <span class="leading-relaxed">${q}</span>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>

                                    <!-- Línea separadora sutil -->
                                    <div class="h-px w-full bg-gray-100 mb-6"></div>

                                    <!-- Consejo -->
                                    <div class="mb-6 bg-amber-50/50 rounded-2xl p-4 sm:p-5 border border-amber-100/50">
                                        <div class="flex items-center gap-2 mb-2 text-amber-600">
                                            <i class="ph-fill ph-lightbulb text-xl"></i>
                                            <h4 class="font-display font-bold text-[1.1rem]">Consejo para padres:</h4>
                                        </div>
                                        <p class="text-gray-700 leading-relaxed text-[0.95rem]">${story.tip}</p>
                                    </div>

                                    <!-- Actividad -->
                                    <div class="bg-cat-${cat.colorRef}-bg/30 rounded-2xl p-4 sm:p-5 border border-cat-${cat.colorRef}-border/30">
                                        <div class="flex items-center gap-2 mb-2 text-cat-${cat.colorRef}-text">
                                            <i class="ph-fill ph-star text-xl"></i>
                                            <h4 class="font-display font-bold text-[1.1rem]">Mini-actividad de la semana:</h4>
                                        </div>
                                        <p class="text-gray-700 leading-relaxed text-[0.95rem]">${story.activity}</p>
                                    </div>

                                </div>
                            </div>
                        </article>
                    `;
                });

                html += `
                        </div>
                    </section>
                `;
            });

            container.innerHTML = html;
        }

        function setFilter(filterId) {
            currentFilter = filterId;
            renderFilters();
            renderContent();
            // Scroll suave hacia arriba si el usuario estaba muy abajo
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleCard(cardId) {
            const card = document.getElementById(cardId).closest('.card');
            
            // Opcional: Cerrar las otras tarjetas al abrir una nueva (comentado para permitir múltiples abiertas)
            // document.querySelectorAll('.card.expanded').forEach(c => {
            //    if(c !== card) c.classList.remove('expanded');
            // });

            card.classList.toggle('expanded');
        }

        // Estilos para la animación de entrada
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            renderFilters();
            renderContent();
        });

    </script>
</body>
</html>
